
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Extintores Seguridad — Inspección</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#141414;
  --paper:#F4F3F0;
  --panel:#FFFFFF;
  --line:#E4E1DA;
  --red:#D0182A;
  --red-dark:#9E1220;
  --amber:#E8A93B;
  --ok:#1F7A4D;
  --ok-bg:#E7F4EC;
  --no:#B3261E;
  --no-bg:#FBE9E7;
  --na:#6B6B6B;
  --na-bg:#ECEBE8;
  --muted:#6E6B65;
  --radius:14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; overscroll-behavior-y:none;}
h1,h2,h3,.label-caps{font-family:'Barlow Condensed',sans-serif;}
button{font-family:inherit;}
input,select,textarea{font-family:'Inter',sans-serif;}

#app{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--paper); position:relative;}

/* HEADER */
.topbar{background:var(--ink); color:#fff; padding:14px 16px 12px; position:sticky; top:0; z-index:30; border-bottom:3px solid var(--red);}
.topbar .brand{display:flex; align-items:baseline; gap:8px;}
.topbar .brand-main{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:22px; letter-spacing:0.5px; text-transform:uppercase;}
.topbar .brand-main span{color:var(--red);}
.topbar .brand-sub{font-size:11px; color:#C9C6C0; letter-spacing:1.5px; text-transform:uppercase; font-weight:600;}
.topbar .meta-row{display:flex; justify-content:space-between; align-items:center; margin-top:2px;}

/* TABS */
.tabbar{display:flex; background:var(--ink); position:sticky; top:56px; z-index:29;}
.tabbar button{flex:1; background:none; border:none; color:#9C9994; font-size:13px; font-weight:700; font-family:'Barlow Condensed',sans-serif; letter-spacing:1px; text-transform:uppercase; padding:10px 4px 12px; border-bottom:3px solid transparent; cursor:pointer;}
.tabbar button.active{color:#fff; border-bottom-color:var(--red);}

.view{display:none; flex:1; padding:14px 14px calc(90px + var(--safe-bottom));}
.view.active{display:block;}

/* SECTIONS */
.section{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:14px; overflow:hidden;}
.section-head{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--line); background:#FAF9F7;}
.section-head h2{margin:0; font-size:18px; font-weight:700; letter-spacing:0.3px; text-transform:uppercase;}
.section-body{padding:14px;}

.field{margin-bottom:12px;}
.field label{display:block; font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:9px; font-size:15px; background:#fff; color:var(--ink);}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--ink);}
.field textarea{resize:vertical; min-height:60px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 10px;}

/* RESULT PICKER (4 estados) */
.result-picker{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.result-btn{border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:9px 8px; font-size:12.5px; font-weight:700; text-align:center; cursor:pointer; letter-spacing:0.2px; text-transform:uppercase; font-family:'Barlow Condensed',sans-serif;}
.result-btn[data-r="CONFORME"].sel{background:var(--ok-bg); border-color:var(--ok); color:var(--ok);}
.result-btn[data-r="OBSERVACIONES"].sel, .result-btn[data-r="OBSERVACION"].sel{background:#FEF6E7; border-color:var(--amber); color:#8A6410;}
.result-btn[data-r="NO CONFORME"].sel{background:var(--no-bg); border-color:var(--no); color:var(--no);}
.result-btn[data-r="REQUIERE SERVICIO"].sel, .result-btn[data-r="RETIRAR"].sel{background:#3A1414; border-color:var(--no); color:#fff;}

/* EXTINTOR CARDS */
.ext-card{border:1.5px solid var(--line); border-radius:12px; margin-bottom:12px; background:#fff;}
.ext-card-head{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; cursor:pointer;}
.ext-card-head .tag{width:30px; height:30px; border-radius:8px; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed'; font-weight:800; font-size:15px; flex-shrink:0;}
.ext-card-title{flex:1; margin-left:10px; overflow:hidden;}
.ext-card-title .t1{font-weight:700; font-size:14.5px; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;}
.ext-card-title .t2{font-size:12px; color:var(--muted);}
.ext-badge{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:0.3px; white-space:nowrap;}
.ext-badge.CONFORME{background:var(--ok-bg); color:var(--ok);}
.ext-badge.OBSERVACION{background:#FEF6E7; color:#8A6410;}
.ext-badge["NO CONFORME"], .ext-badge.NOCONFORME{background:var(--no-bg); color:var(--no);}
.ext-badge.RETIRAR{background:var(--no); color:#fff;}
.ext-badge.pendiente{background:var(--na-bg); color:var(--na);}
.chev{color:var(--muted); font-size:20px; margin-left:6px; transition:transform .15s;}
.ext-card.open .chev{transform:rotate(180deg);}
.ext-card-body{display:none; padding:0 12px 14px; border-top:1px solid var(--line);}
.ext-card.open .ext-card-body{display:block;}

/* CHECKLIST */
.check-item{display:flex; align-items:center; justify-content:space-between; padding:9px 2px; border-bottom:1px solid #F0EEEA;}
.check-item:last-child{border-bottom:none;}
.check-item .ci-label{font-size:13.5px; flex:1; padding-right:10px; line-height:1.25;}
.ci-btns{display:flex; gap:5px; flex-shrink:0;}
.ci-btn{width:38px; height:32px; border-radius:8px; border:1.5px solid var(--line); background:#fff; font-weight:800; font-size:12.5px; font-family:'Barlow Condensed'; cursor:pointer; color:var(--muted);}
.ci-btn.ok.sel{background:var(--ok); border-color:var(--ok); color:#fff;}
.ci-btn.no.sel{background:var(--no); border-color:var(--no); color:#fff;}
.ci-btn.na.sel{background:var(--na); border-color:var(--na); color:#fff;}

.photo-row{display:flex; gap:8px; margin-top:4px; flex-wrap:wrap;}
.photo-thumb{width:64px; height:64px; border-radius:8px; object-fit:cover; border:1.5px solid var(--line);}
.photo-add{width:64px; height:64px; border-radius:8px; border:1.5px dashed var(--line); background:#FAF9F7; display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--muted); cursor:pointer;}
.photo-wrap{position:relative;}
.photo-del{position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:var(--ink); color:#fff; font-size:12px; display:flex; align-items:center; justify-content:center; border:2px solid var(--paper);}

.btn{border:none; border-radius:11px; font-weight:700; font-size:14.5px; padding:12px 16px; cursor:pointer; text-align:center; font-family:'Barlow Condensed'; letter-spacing:0.3px; text-transform:uppercase;}
.btn-primary{background:var(--red); color:#fff; width:100%;}
.btn-outline{background:#fff; color:var(--ink); border:1.5px solid var(--line); width:100%;}
.btn-dark{background:var(--ink); color:#fff;}
.btn-ghost{background:none; color:var(--red); font-weight:700; padding:8px;}
.btn-danger-ghost{background:none; color:var(--no); font-weight:700; padding:8px;}
.btn-sm{padding:8px 12px; font-size:12.5px; border-radius:9px;}

.add-ext-btn{width:100%; border:1.5px dashed var(--red); background:#FDF1F1; color:var(--red); border-radius:12px; padding:13px; font-weight:700; font-family:'Barlow Condensed'; font-size:15px; letter-spacing:0.3px; text-transform:uppercase; cursor:pointer;}

/* SIGNATURE */
.sig-box{border:1.5px solid var(--line); border-radius:10px; background:#fff; touch-action:none;}
.sig-actions{display:flex; justify-content:flex-end; margin-top:6px;}

/* FLOATING BOTTOM BAR */
.bottombar{position:fixed; bottom:0; left:0; right:0; z-index:40; background:linear-gradient(0deg, var(--paper) 60%, rgba(244,243,240,0));}
.bottombar-inner{max-width:560px; margin:0 auto; padding:14px 14px calc(14px + var(--safe-bottom));}

/* HISTORY */
.hist-item{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; display:flex; align-items:center; gap:12px; cursor:pointer;}
.hist-item .hi-main{flex:1; min-width:0;}
.hist-item .hi-title{font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.hist-item .hi-sub{font-size:12px; color:var(--muted); margin-top:2px;}
.empty-state{text-align:center; padding:60px 20px; color:var(--muted);}
.empty-state .es-icon{font-size:38px; margin-bottom:10px;}
.empty-state h3{margin:0 0 6px; color:var(--ink);}

/* MODAL (detalle historial) */
.modal-overlay{position:fixed; inset:0; background:rgba(20,20,20,0.55); z-index:50; display:none; align-items:flex-end;}
.modal-overlay.show{display:flex;}
.modal-sheet{background:var(--paper); width:100%; max-height:92vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:16px 16px calc(20px + var(--safe-bottom));}
.modal-handle{width:40px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 12px;}

.toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:30px; font-size:13.5px; font-weight:600; z-index:60; opacity:0; transition:opacity .2s; pointer-events:none;}
.toast.show{opacity:1;}

.req-note{font-size:11px; color:var(--muted); margin-top:-6px; margin-bottom:10px;}
.divider-label{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.8px; margin:14px 0 8px;}

/* AUTH / LOGIN */
.gear-btn{background:none; border:none; color:#C9C6C0; font-size:19px; cursor:pointer; padding:4px; line-height:1; position:relative;}
.gear-badge{position:absolute; top:-2px; right:-2px; background:var(--red); color:#fff; font-size:10px; font-weight:800; min-width:16px; height:16px; border-radius:8px; display:none; align-items:center; justify-content:center; padding:0 3px; font-family:'Inter',sans-serif;}
.gear-badge.show{display:flex;}
#auth-overlay{position:fixed; inset:0; background:var(--ink); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px;}
.auth-card{background:var(--panel); width:100%; max-width:360px; border-radius:16px; padding:28px 24px; border-top:4px solid var(--red);}
.auth-logo{font-family:'Barlow Condensed'; font-weight:800; font-size:24px; text-transform:uppercase; text-align:center; margin-bottom:2px;}
.auth-logo span{color:var(--red);}
.auth-sub{text-align:center; font-size:12px; color:var(--muted); margin-bottom:20px; letter-spacing:0.5px; text-transform:uppercase; font-weight:600;}
.auth-error{background:var(--no-bg); color:var(--no); font-size:12.5px; font-weight:600; padding:8px 10px; border-radius:8px; margin-bottom:12px; display:none;}
.auth-error.show{display:block;}
.auth-switch{text-align:center; margin-top:14px; font-size:12.5px; color:var(--muted);}
.auth-switch a{color:var(--red); font-weight:700; cursor:pointer; text-decoration:none;}

/* GESTIÓN DE USUARIOS */
.user-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line);}
.user-row:last-child{border-bottom:none;}
.user-row .u-name{font-weight:700; font-size:14px;}
.user-row .u-user{font-size:12px; color:var(--muted);}
</style>
</head>
<body>
<div id="auth-overlay">
  <div class="auth-card" id="auth-card"></div>
</div>
<div id="app" style="display:none;">

  <div class="topbar">
    <div class="brand">
      <div class="brand-main">EXTINTOR<span>ES</span></div>
      <div style="flex:1;"></div>
      <button class="gear-btn" id="gear-btn" onclick="abrirGestionUsuarios()" title="Usuarios" style="display:none;">⚙<span class="gear-badge" id="gear-badge"></span></button>
    </div>
    <div class="meta-row">
      <div class="brand-sub">SEGURIDAD · INSPECCIÓN DE CAMPO · SINCRONIZADO</div>
      <a id="btn-cerrar-sesion" onclick="cerrarSesion()" style="color:#C9C6C0; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; cursor:pointer;"></a>
    </div>
  </div>

  <div class="tabbar">
    <button id="tab-nueva" class="active" onclick="switchTab('nueva')">Nueva inspección</button>
    <button id="tab-historial" onclick="switchTab('historial')">Historial</button>
  </div>

  <!-- ================= VISTA: NUEVA INSPECCIÓN ================= -->
  <div id="view-nueva" class="view active"></div>

  <!-- ================= VISTA: HISTORIAL ================= -->
  <div id="view-historial" class="view">
    <div id="historial-list"></div>
  </div>

  <div class="bottombar" id="bottombar-nueva">
    <div class="bottombar-inner">
      <button class="btn btn-primary" onclick="guardarInspeccion()">Guardar inspección</button>
    </div>
  </div>

</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this) cerrarModal()">
  <div class="modal-sheet" id="modal-sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================= DATOS BASE ============================= */
const CHECK_ITEMS = [
  {key:'ubicacion',    label:'Ubicación y acceso'},
  {key:'visibilidad',  label:'Visibilidad / señalización'},
  {key:'cilindro',     label:'Cilindro / cuerpo'},
  {key:'corrosion',    label:'Corrosión / daño físico'},
  {key:'manometro',    label:'Manómetro / indicador'},
  {key:'pasador',      label:'Pasador de seguridad'},
  {key:'sello',        label:'Sello / indicador de manipulación'},
  {key:'manguera',     label:'Manguera'},
  {key:'boquilla',     label:'Boquilla / difusor'},
  {key:'etiqueta',     label:'Etiqueta / instrucciones'},
  {key:'evidenciaUso', label:'Evidencia de uso o descarga'},
  {key:'condicionGeneral', label:'Condición general'}
];
const RESULT_GENERAL = ['CONFORME','OBSERVACIONES','NO CONFORME','REQUIERE SERVICIO'];
const RESULT_EXT = ['CONFORME','OBSERVACION','NO CONFORME','RETIRAR'];
const RESULT_EXT_LABEL = {CONFORME:'Conforme', OBSERVACION:'Observación', 'NO CONFORME':'No conforme', RETIRAR:'Retirar'};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function blankChecklist(){ const o={}; CHECK_ITEMS.forEach(c=>o[c.key]='' ); return o; }
function blankExtintor(){
  return { id: uid(), codigo:'', ubicacion:'', tipo:'PQS', capacidad:'', marca:'', modelo:'', serie:'',
    anio:'', ultimoServicio:'', ultimaPrueba:'', checklist: blankChecklist(), resultado:'', observaciones:'', fotos:[], open:true };
}
function blankInspeccion(){
  return { id: uid(), createdAt: Date.now(),
    empresa:'', cedula:'', direccion:'', telefono:'', responsable:'', correo:'',
    fecha: new Date().toISOString().slice(0,10), tecnico:'',
    resultadoGeneral:'', extintores:[ blankExtintor() ],
    firmaTecnicoNombre:'', firmaClienteNombre:'', firmaTecnicoImg:'', firmaClienteImg:'' };
}

let current = blankInspeccion();
let sigTecnicoCtx=null, sigClienteCtx=null;

/* ============================= TOAST ============================= */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ============================= TABS ============================= */
function switchTab(name){
  document.getElementById('tab-nueva').classList.toggle('active', name==='nueva');
  document.getElementById('tab-historial').classList.toggle('active', name==='historial');
  document.getElementById('view-nueva').classList.toggle('active', name==='nueva');
  document.getElementById('view-historial').classList.toggle('active', name==='historial');
  document.getElementById('bottombar-nueva').style.display = name==='nueva' ? 'block':'none';
  if(name==='historial') renderHistorial();
}

/* ============================= RENDER: NUEVA ============================= */
function renderNueva(){
  const el = document.getElementById('view-nueva');
  el.innerHTML = `
    <div class="section">
      <div class="section-head"><h2>Datos del cliente</h2></div>
      <div class="section-body">
        <div class="field"><label>Empresa / establecimiento</label><input id="f-empresa" value="${esc(current.empresa)}" oninput="current.empresa=this.value"></div>
        <div class="grid2">
          <div class="field"><label>Cédula jurídica</label><input id="f-cedula" value="${esc(current.cedula)}" oninput="current.cedula=this.value"></div>
          <div class="field"><label>Teléfono / WhatsApp</label><input type="tel" value="${esc(current.telefono)}" oninput="current.telefono=this.value"></div>
        </div>
        <div class="field"><label>Dirección</label><input value="${esc(current.direccion)}" oninput="current.direccion=this.value"></div>
        <div class="grid2">
          <div class="field"><label>Persona responsable</label><input value="${esc(current.responsable)}" oninput="current.responsable=this.value"></div>
          <div class="field"><label>Correo</label><input type="email" value="${esc(current.correo)}" oninput="current.correo=this.value"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Fecha de inspección</label><input type="date" value="${current.fecha}" oninput="current.fecha=this.value"></div>
          <div class="field"><label>Técnico responsable</label><input value="${esc(current.tecnico)}" oninput="current.tecnico=this.value"></div>
        </div>
      </div>
    </div>

    <div class="divider-label">Extintores inspeccionados</div>
    <div id="ext-list"></div>
    <button class="add-ext-btn" onclick="agregarExtintor()">+ Agregar extintor</button>

    <div class="section" style="margin-top:16px;">
      <div class="section-head"><h2>Resultado general de la visita</h2></div>
      <div class="section-body">
        <div class="result-picker" id="result-general">
          ${RESULT_GENERAL.map(r=>`<div class="result-btn${current.resultadoGeneral===r?' sel':''}" data-r="${r}" onclick="setResultadoGeneral('${r}')">${r}</div>`).join('')}
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>Firmas</h2></div>
      <div class="section-body">
        <div class="field"><label>Técnico responsable — nombre</label><input value="${esc(current.firmaTecnicoNombre)}" oninput="current.firmaTecnicoNombre=this.value"></div>
        <canvas id="sig-tecnico" class="sig-box" height="130"></canvas>
        <div class="sig-actions"><button class="btn-ghost btn-sm" onclick="limpiarFirma('tecnico')">Borrar firma</button></div>

        <div class="field" style="margin-top:14px;"><label>Cliente / encargado — nombre</label><input value="${esc(current.firmaClienteNombre)}" oninput="current.firmaClienteNombre=this.value"></div>
        <canvas id="sig-cliente" class="sig-box" height="130"></canvas>
        <div class="sig-actions"><button class="btn-ghost btn-sm" onclick="limpiarFirma('cliente')">Borrar firma</button></div>
      </div>
    </div>
  `;
  renderExtintores();
  setupSignaturePad('sig-tecnico','tecnico');
  setupSignaturePad('sig-cliente','cliente');
}

function esc(s){ return (s||'').toString().replace(/"/g,'&quot;'); }

function setResultadoGeneral(r){
  current.resultadoGeneral = r;
  document.querySelectorAll('#result-general .result-btn').forEach(b=>b.classList.toggle('sel', b.dataset.r===r));
}

/* ============================= EXTINTORES ============================= */
function agregarExtintor(){
  current.extintores.forEach(e=>e.open=false);
  const ne = blankExtintor();
  current.extintores.push(ne);
  renderExtintores();
  setTimeout(()=>document.getElementById('card-'+ne.id)?.scrollIntoView({behavior:'smooth', block:'start'}), 50);
}
function eliminarExtintor(id){
  if(current.extintores.length<=1){ toast('Debe quedar al menos un extintor'); return; }
  if(!confirm('¿Eliminar este extintor de la inspección?')) return;
  current.extintores = current.extintores.filter(e=>e.id!==id);
  renderExtintores();
}
function toggleExtCard(id){
  const e = current.extintores.find(x=>x.id===id);
  e.open = !e.open;
  renderExtintores();
}
function badgeClassFor(r){
  if(!r) return 'pendiente';
  if(r==='NO CONFORME') return 'NOCONFORME';
  return r;
}
function renderExtintores(){
  const wrap = document.getElementById('ext-list');
  wrap.innerHTML = current.extintores.map((ex,idx)=>`
    <div class="ext-card${ex.open?' open':''}" id="card-${ex.id}">
      <div class="ext-card-head" onclick="toggleExtCard('${ex.id}')">
        <div class="tag">${idx+1}</div>
        <div class="ext-card-title">
          <div class="t1">${ex.codigo ? esc(ex.codigo) : 'Extintor '+(idx+1)}</div>
          <div class="t2">${ex.ubicacion ? esc(ex.ubicacion) : 'Sin ubicación'} ${ex.tipo?('· '+ex.tipo):''}</div>
        </div>
        <span class="ext-badge ${badgeClassFor(ex.resultado)}">${ex.resultado ? RESULT_EXT_LABEL[ex.resultado] : 'Pendiente'}</span>
        <span class="chev">⌄</span>
      </div>
      <div class="ext-card-body">
        <div class="field"><label>Capacidad</label><input value="${esc(ex.capacidad)}" placeholder="ej. 10 lb" oninput="updateExt('${ex.id}','capacidad',this.value)"></div>

function updateExt(id, field, value){
  const ex = current.extintores.find(e=>e.id===id);
  ex[field]=value;
  if(field==='ubicacion' || field==='tipo'){
    // Actualiza solo el texto del encabezado, sin redibujar toda la tarjeta
    // (redibujarla en cada tecla hacía que el campo perdiera el foco al escribir).
    const card = document.getElementById('card-'+id);
    if(card){
      const t2 = card.querySelector('.t2');
      if(t2) t2.textContent = (ex.ubicacion ? ex.ubicacion : 'Sin ubicación') + (ex.tipo ? ' · '+ex.tipo : '');
    }
  }
}
function setCheck(id, key, val){
  const ex = current.extintores.find(e=>e.id===id);
  ex.checklist[key] = (ex.checklist[key]===val) ? '' : val;
  renderExtintores();
}
function setExtResultado(id, r){
  const ex = current.extintores.find(e=>e.id===id);
  ex.resultado = r;
  renderExtintores();
}
function quitarFoto(id, idx){
  const ex = current.extintores.find(e=>e.id===id);
  ex.fotos.splice(idx,1);
  renderExtintores();
}
function agregarFoto(id, input){
  const file = input.files[0];
  if(!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = e => {
    img.onload = () => {
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
      const ex = current.extintores.find(x=>x.id===id);
      ex.fotos.push(dataUrl);
      renderExtintores();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value='';
}

/* ============================= FIRMAS (canvas) ============================= */
function setupSignaturePad(canvasId, who){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width*dpr;
  canvas.height = 130*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.strokeStyle = '#141414';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  if(who==='tecnico') sigTecnicoCtx = ctx; else sigClienteCtx = ctx;

  const existing = who==='tecnico' ? current.firmaTecnicoImg : current.firmaClienteImg;
  if(existing){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,rect.width,130); im.src=existing; }

  let drawing=false;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x: t.clientX-r.left, y: t.clientY-r.top};
  }
  function start(e){ drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(e){
    if(!drawing) return;
    drawing=false;
    const data = canvas.toDataURL('image/png');
    if(who==='tecnico') current.firmaTecnicoImg=data; else current.firmaClienteImg=data;
  }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}
function limpiarFirma(who){
  const canvas = document.getElementById(who==='tecnico'?'sig-tecnico':'sig-cliente');
  const ctx = who==='tecnico'?sigTecnicoCtx:sigClienteCtx;
  const rect = canvas.getBoundingClientRect();
  ctx.clearRect(0,0,rect.width,130);
  if(who==='tecnico') current.firmaTecnicoImg=''; else current.firmaClienteImg='';
}

/* ============================= GUARDAR / STORAGE — FIRESTORE (proyecto real) =============================
   Cada inspección se guarda como un documento en la colección "inspecciones" del mismo
   proyecto Firebase que usa el sistema principal (extintores.html), sin tocar sus colecciones. */
const INSP_COLLECTION = 'inspecciones';

function fsEncodeInspeccion(insp){
  return { fields: {
    json: { stringValue: JSON.stringify(insp) },
    empresa: { stringValue: insp.empresa || '' },
    fecha: { stringValue: insp.fecha || '' },
    tecnico: { stringValue: insp.tecnico || '' },
    resultado: { stringValue: insp.resultadoGeneral || '' },
    nExtintores: { integerValue: String(insp.extintores.length) },
    createdAt: { integerValue: String(insp.createdAt) },
  }};
}
function fsField(doc, name, fallback){
  return doc.fields && doc.fields[name] ? (doc.fields[name].stringValue ?? doc.fields[name].integerValue ?? fallback) : fallback;
}

async function guardarInspeccionFS(insp){
  const url = `${FIRESTORE_BASE}/${INSP_COLLECTION}/${insp.id}?key=${FIREBASE_API_KEY}`;
  const res = await fetch(url, {
    method:'PATCH',
    headers: Object.assign({'Content-Type':'application/json'}, authHeaders()),
    body: JSON.stringify(fsEncodeInspeccion(insp))
  });
  if(!res.ok) throw new Error('No se pudo guardar en Firestore: ' + res.status);
}

async function listarInspeccionesFS(){
  const url = `${FIRESTORE_BASE}/${INSP_COLLECTION}?key=${FIREBASE_API_KEY}&pageSize=300`;
  const res = await fetch(url, { headers: authHeaders() });
  if(!res.ok) return [];
  const data = await res.json();
  if(!data.documents) return [];
  return data.documents.map(d=>{
    const parts = d.name.split('/');
    return {
      id: parts[parts.length-1],
      empresa: fsField(d,'empresa',''), fecha: fsField(d,'fecha',''),
      tecnico: fsField(d,'tecnico',''), resultado: fsField(d,'resultado',''),
      nExtintores: parseInt(fsField(d,'nExtintores','0'),10) || 0,
      createdAt: parseInt(fsField(d,'createdAt','0'),10) || 0,
    };
  });
}

async function obtenerInspeccionFS(id){
  const url = `${FIRESTORE_BASE}/${INSP_COLLECTION}/${id}?key=${FIREBASE_API_KEY}`;
  const res = await fetch(url, { headers: authHeaders() });
  if(!res.ok) return null;
  const data = await res.json();
  const raw = fsField(data,'json', null);
  return raw ? JSON.parse(raw) : null;
}

async function eliminarInspeccionFS(id){
  const url = `${FIRESTORE_BASE}/${INSP_COLLECTION}/${id}?key=${FIREBASE_API_KEY}`;
  await fetch(url, { method:'DELETE', headers: authHeaders() });
}

async function guardarInspeccion(){
  if(!current.empresa){ toast('Ingresá el nombre de la empresa'); return; }
  if(!current.resultadoGeneral){ toast('Seleccioná el resultado general de la visita'); return; }
  const btn = event?.target;
  if(btn){ btn.disabled=true; btn.textContent='Guardando...'; }
  try{
    await conReintentos(()=>guardarInspeccionFS(current), 3);
    toast('Inspección guardada y sincronizada ✓');
    current = blankInspeccion();
    renderNueva();
  }catch(e){
    console.error(e);
    toast('No se pudo guardar. Revisá tu conexión e intentá de nuevo.');
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='Guardar inspección'; }
  }
}

async function exportarPDF(id){
  const insp = await obtenerInspeccionFS(id);
  if(!insp){ toast('No se encontró la inspección'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'letter'});
  const pageW = doc.internal.pageSize.getWidth();
  const margin = 44;
  let y = 0;

  function checkBreak(h){
    if(y + h > 760){ doc.addPage(); drawFooterLine(); y = 50; }
  }
  function drawFooterLine(){
    doc.setDrawColor(211,24,42); doc.setLineWidth(2);
    doc.line(0,0,pageW,0);
  }
  function header(){
    doc.setFillColor(20,20,20); doc.rect(0,0,pageW,64,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(18);
    doc.text('EXTINTORES SEGURIDAD', margin, 30);
    doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(210,210,210);
    doc.text('Tel: 2101-4399  ·  extintoresseguridad.cr@gmail.com', margin, 46);
    doc.setDrawColor(211,24,42); doc.setLineWidth(3); doc.line(0,64,pageW,64);
    y = 92;
  }
  function sectionTitle(t){
    checkBreak(26);
    doc.setFillColor(244,243,240); doc.rect(margin-6, y-14, pageW-2*(margin-6), 22, 'F');
    doc.setTextColor(20,20,20); doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text(t.toUpperCase(), margin, y+2);
    y += 26;
  }
  function kv(label, value){
    checkBreak(16);
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(100,100,100);
    doc.text(label, margin, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(20,20,20);
    doc.text(String(value||'—'), margin+140, y);
    y += 16;
  }

  header();
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(20,20,20);
  doc.text('Reporte de inspección de extintores portátiles', margin, y); y += 20;

  sectionTitle('Datos del cliente');
  kv('Empresa', insp.empresa); kv('Cédula jurídica', insp.cedula); kv('Dirección', insp.direccion);
  kv('Teléfono', insp.telefono); kv('Responsable', insp.responsable); kv('Correo', insp.correo);
  kv('Fecha de inspección', insp.fecha); kv('Técnico responsable', insp.tecnico);
  y += 6;

  sectionTitle('Resultado general de la visita');
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  const rc = {'CONFORME':[31,122,77],'OBSERVACIONES':[138,100,16],'NO CONFORME':[179,38,30],'REQUIERE SERVICIO':[179,38,30]}[insp.resultadoGeneral]||[20,20,20];
  doc.setTextColor(rc[0],rc[1],rc[2]);
  doc.text(insp.resultadoGeneral||'—', margin, y); y+=20;
  doc.setTextColor(20,20,20);

  insp.extintores.forEach((ex, i)=>{
    checkBreak(40);
    sectionTitle('Extintor '+(i+1));
    kv('Ubicación', ex.ubicacion); kv('Tipo / Capacidad', (ex.tipo||'')+' / '+(ex.capacidad||'—'));
    kv('Marca', ex.marca||'—');
    kv('Año fabricación', ex.anio); kv('Último servicio', ex.ultimoServicio);
    const rce = {'CONFORME':[31,122,77],'OBSERVACION':[138,100,16],'NO CONFORME':[179,38,30],'RETIRAR':[179,38,30]}[ex.resultado]||[20,20,20];
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(rce[0],rce[1],rce[2]);
    checkBreak(16);
    doc.text('Resultado: '+(RESULT_EXT_LABEL[ex.resultado]||'—'), margin, y); y+=16;
    doc.setTextColor(20,20,20);

    const fails = CHECK_ITEMS.filter(ci=>ex.checklist[ci.key]==='NO');
    if(fails.length){
      checkBreak(14);
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(179,38,30);
      doc.text('Puntos NO conformes:', margin, y); y+=13;
      doc.setFont('helvetica','normal'); doc.setTextColor(20,20,20);
      fails.forEach(f=>{
        checkBreak(13);
        doc.text('• '+f.label, margin+8, y); y+=13;
      });
    }
    if(ex.observaciones){
      checkBreak(26);
      doc.setFont('helvetica','italic'); doc.setFontSize(9.5); doc.setTextColor(70,70,70);
      const lines = doc.splitTextToSize('Obs: '+ex.observaciones, pageW-2*margin);
      lines.forEach(l=>{ checkBreak(12); doc.text(l, margin, y); y+=12; });
      doc.setFont('helvetica','normal');
    }
    if(ex.fotos && ex.fotos.length){
      checkBreak(96);
      let fx = margin;
      ex.fotos.slice(0,4).forEach(f=>{
        try{ doc.addImage(f, 'JPEG', fx, y, 82, 82); }catch(e){}
        fx += 90;
      });
      y += 96;
    }
    y += 4;
  });

  checkBreak(150);
  sectionTitle('Firmas');
  const sigW=200, sigH=70;
  if(insp.firmaTecnicoImg){ try{ doc.addImage(insp.firmaTecnicoImg,'PNG', margin, y, sigW, sigH); }catch(e){} }
  if(insp.firmaClienteImg){ try{ doc.addImage(insp.firmaClienteImg,'PNG', margin+220, y, sigW, sigH); }catch(e){} }
  y += sigH+4;
  doc.setDrawColor(180,180,180); doc.setLineWidth(0.6);
  doc.line(margin, y, margin+sigW, y); doc.line(margin+220, y, margin+220+sigW, y);
  y += 12;
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(20,20,20);
  doc.text(insp.firmaTecnicoNombre||'Técnico responsable', margin, y);
  doc.text(insp.firmaClienteNombre||'Cliente / encargado', margin+220, y);

  doc.save('Inspeccion_'+(insp.empresa||'cliente').replace(/[^a-z0-9]+/gi,'_')+'_'+insp.fecha+'.pdf');
  toast('PDF generado ✓');
}

function authHeaders(){ return authUser && authUser.idToken ? { 'Authorization': 'Bearer ' + authUser.idToken } : {}; }

async function esperar(ms){ return new Promise(r=>setTimeout(r, ms)); }
async function conReintentos(fn, intentos){
  let ultimoError=null;
  for(let i=0;i<intentos;i++){
    try{ return await fn(); }
    catch(e){ ultimoError=e; if(i<intentos-1) await esperar(300*Math.pow(3,i)); }
  }
  throw ultimoError;
}

async function refreshIdTokenIfNeeded(){
  if(!authUser) return false;
  if(authUser.expiresAt && Date.now() < authUser.expiresAt - 60000) return true;
  try{
    const res = await fetch(AUTH_REFRESH_URL, {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'grant_type=refresh_token&refresh_token=' + encodeURIComponent(authUser.refreshToken)
    });
    if(!res.ok) return false;
    const data = await res.json();
    authUser = Object.assign({}, authUser, {
      idToken: data.id_token, refreshToken: data.refresh_token,
      expiresAt: Date.now() + (parseInt(data.expires_in,10)||3600)*1000,
    });
    saveSession();
    return true;
  }catch(e){ return false; }
}

/* ---- Perfil de usuario (rol) en la colección propia de esta app ---- */
async function fetchUserDoc(uid){
  const url = `${FIRESTORE_BASE}/${USERS_COLLECTION}/${uid}?key=${FIREBASE_API_KEY}`;
  const res = await fetch(url, { headers: authHeaders() });
  if(res.status===404) return null;
  if(!res.ok) throw new Error('perfil get failed: '+res.status);
  const data = await res.json();
  return {
    role: data.fields && data.fields.role ? data.fields.role.stringValue : 'pending',
    email: data.fields && data.fields.email ? data.fields.email.stringValue : '',
    nombre: data.fields && data.fields.nombre ? data.fields.nombre.stringValue : '',
  };
}
async function ensureUserDoc(uid, email, nombreSiNuevo){
  let doc = await fetchUserDoc(uid);
  if(doc) return doc;
  const role = (email||'').toLowerCase()===OWNER_EMAIL ? 'admin' : 'pending';
  const url = `${FIRESTORE_BASE}/${USERS_COLLECTION}/${uid}?key=${FIREBASE_API_KEY}`;
  const body = { fields: {
    email: { stringValue: email||'' },
    nombre: { stringValue: nombreSiNuevo || email || '' },
    role: { stringValue: role },
    createdAt: { stringValue: new Date().toISOString() },
  }};
  await fetch(url, { method:'PATCH', headers: Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify(body) });
  return { role, email, nombre: nombreSiNuevo || email || '' };
}
async function setUserRole(uid, role){
  const url = `${FIRESTORE_BASE}/${USERS_COLLECTION}/${uid}?key=${FIREBASE_API_KEY}&updateMask.fieldPaths=role`;
  await fetch(url, { method:'PATCH', headers: Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify({fields:{role:{stringValue:role}}}) });
}
async function fetchAllUsers(){
  const url = `${FIRESTORE_BASE}/${USERS_COLLECTION}?key=${FIREBASE_API_KEY}`;
  const res = await fetch(url, { headers: authHeaders() });
  if(!res.ok) return [];
  const data = await res.json();
  if(!data.documents) return [];
  return data.documents.map(d=>{
    const parts = d.name.split('/');
    return {
      uid: parts[parts.length-1],
      email: d.fields && d.fields.email ? d.fields.email.stringValue : '',
      nombre: d.fields && d.fields.nombre ? d.fields.nombre.stringValue : '',
      role: d.fields && d.fields.role ? d.fields.role.stringValue : 'pending',
    };
  });
}

function translateAuthError(msg){
  msg = msg || '';
  if(msg.includes('EMAIL_EXISTS')) return 'Ese correo ya tiene una cuenta — iniciá sesión en vez de solicitar acceso.';
  if(msg.includes('EMAIL_NOT_FOUND') || msg.includes('INVALID_PASSWORD') || msg.includes('INVALID_LOGIN_CREDENTIALS')) return 'Correo o contraseña incorrectos.';
  if(msg.includes('WEAK_PASSWORD')) return 'La contraseña debe tener al menos 6 caracteres.';
  if(msg.includes('INVALID_EMAIL')) return 'Ese correo no es válido.';
  return msg || 'Ocurrió un error, intentá de nuevo.';
}

async function doSignUp(nombre, email, password){
  authBusy=true; authError=''; renderAuth();
  try{
    const res = await fetch(AUTH_SIGNUP_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, password, returnSecureToken:true}) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error && data.error.message || 'Error al crear la cuenta');
    authUser = { uid:data.localId, email:data.email, idToken:data.idToken, refreshToken:data.refreshToken, expiresAt: Date.now()+(parseInt(data.expiresIn,10)||3600)*1000 };
    saveSession();
    const profile = await ensureUserDoc(authUser.uid, authUser.email, nombre);
    authBusy=false;
    afterAuthReady(profile);
  }catch(e){
    authBusy=false; authError=translateAuthError(e.message); renderAuth();
  }
}
async function doSignIn(email, password){
  authBusy=true; authError=''; renderAuth();
  try{
    const res = await fetch(AUTH_SIGNIN_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, password, returnSecureToken:true}) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error && data.error.message || 'Error al iniciar sesión');
    authUser = { uid:data.localId, email:data.email, idToken:data.idToken, refreshToken:data.refreshToken, expiresAt: Date.now()+(parseInt(data.expiresIn,10)||3600)*1000 };
    saveSession();
    const profile = await ensureUserDoc(authUser.uid, authUser.email, null);
    authBusy=false;
    afterAuthReady(profile);
  }catch(e){
    authBusy=false; authError=translateAuthError(e.message); renderAuth();
  }
}
function cerrarSesion(){
  if(!confirm('¿Cerrar sesión?')) return;
  if(pendientesInterval){ clearInterval(pendientesInterval); pendientesInterval=null; }
  authUser=null; sesion=null; saveSession();
  document.getElementById('app').style.display='none';
  document.getElementById('auth-overlay').style.display='flex';
  authView='login'; authError='';
  renderAuth();
}

async function initAuth(){
  authUser = loadSession();
  if(authUser){
    const ok = await refreshIdTokenIfNeeded();
    if(!ok){ authUser=null; saveSession(); }
  }
  if(authUser){
    try{
      const profile = await ensureUserDoc(authUser.uid, authUser.email, null);
      afterAuthReady(profile);
    }catch(e){ authUser=null; saveSession(); authView='login'; renderAuth(); }
  } else {
    authView='login'; renderAuth();
  }
}

function afterAuthReady(profile){
  if(!authUser){ authView='login'; renderAuth(); return; }
  if(profile.role==='pending'){ renderPendingScreen(); return; }
  if(profile.role==='rejected'){ renderRejectedScreen(); return; }
  entrarComo(profile);
}

function renderAuth(){
  const card = document.getElementById('auth-card');
  document.getElementById('auth-overlay').style.display='flex';
  document.getElementById('app').style.display='none';
  if(authView==='signup'){
    card.innerHTML = `
      <div class="auth-logo">EXTINTOR<span>ES</span></div>
      <div class="auth-sub">Solicitar acceso como técnico</div>
      <div class="auth-error${authError?' show':''}" id="auth-err">${esc(authError)}</div>
      <div class="field"><label>Nombre completo</label><input id="su-nombre"></div>
      <div class="field"><label>Correo</label><input id="su-email" type="email" autocapitalize="off"></div>
      <div class="field"><label>Contraseña</label><input id="su-pass" type="password"></div>
      <button class="btn btn-primary" ${authBusy?'disabled':''} onclick="onSignUpClick()">${authBusy?'Enviando...':'Crear cuenta'}</button>
      <div class="req-note" style="margin-top:8px;">Si tu correo es el principal del negocio, entrás directo como administrador. Si no, tu cuenta queda pendiente de aprobación.</div>
      <div class="auth-switch"><a onclick="authView='login'; authError=''; renderAuth();">Ya tengo cuenta — iniciar sesión</a></div>
    `;
  } else {
    card.innerHTML = `
      <div class="auth-logo">EXTINTOR<span>ES</span></div>
      <div class="auth-sub">Iniciar sesión</div>
      <div class="auth-error${authError?' show':''}" id="auth-err">${esc(authError)}</div>
      <div class="field"><label>Correo</label><input id="li-email" type="email" autocapitalize="off" onkeydown="if(event.key==='Enter')document.getElementById('li-pass').focus()"></div>
      <div class="field"><label>Contraseña</label><input id="li-pass" type="password" onkeydown="if(event.key==='Enter')onSignInClick()"></div>
      <button class="btn btn-primary" ${authBusy?'disabled':''} onclick="onSignInClick()">${authBusy?'Entrando...':'Entrar'}</button>
      <div class="auth-switch"><a onclick="authView='signup'; authError=''; renderAuth();">¿Sos técnico y no tenés cuenta? Solicitar acceso</a></div>
    `;
  }
}
function onSignUpClick(){
  const nombre = document.getElementById('su-nombre').value.trim();
  const email = document.getElementById('su-email').value.trim();
  const pass = document.getElementById('su-pass').value;
  if(!nombre || !email || !pass){ authError='Completá todos los campos'; renderAuth(); return; }
  doSignUp(nombre, email, pass);
}
function onSignInClick(){
  const email = document.getElementById('li-email').value.trim();
  const pass = document.getElementById('li-pass').value;
  if(!email || !pass){ authError='Ingresá correo y contraseña'; renderAuth(); return; }
  doSignIn(email, pass);
}

function renderPendingScreen(){
  const card = document.getElementById('auth-card');
  document.getElementById('auth-overlay').style.display='flex';
  document.getElementById('app').style.display='none';
  card.innerHTML = `
    <div class="auth-logo">EXTINTOR<span>ES</span></div>
    <div class="auth-sub">Cuenta pendiente</div>
    <div style="font-size:14px; text-align:center; color:var(--muted); margin-bottom:16px;">Tu cuenta ya existe pero está esperando la aprobación del administrador. Cuando la apruebe, vas a poder entrar con el mismo correo y contraseña.</div>
    <button class="btn btn-outline" onclick="cerrarSesion()">Salir</button>
  `;
}
function renderRejectedScreen(){
  const card = document.getElementById('auth-card');
  document.getElementById('auth-overlay').style.display='flex';
  document.getElementById('app').style.display='none';
  card.innerHTML = `
    <div class="auth-logo">EXTINTOR<span>ES</span></div>
    <div class="auth-sub">Acceso no autorizado</div>
    <div style="font-size:14px; text-align:center; color:var(--muted); margin-bottom:16px;">El administrador no aprobó el acceso de esta cuenta a la app de inspecciones.</div>
    <button class="btn btn-outline" onclick="cerrarSesion()">Salir</button>
  `;
}

function entrarComo(profile){
  sesion = { uid:authUser.uid, email:authUser.email, nombre:profile.nombre||authUser.email, rol:profile.role };
  document.getElementById('auth-overlay').style.display='none';
  document.getElementById('app').style.display='flex';
  const cs = document.getElementById('btn-cerrar-sesion');
  cs.textContent = 'Salir (' + sesion.nombre.split(' ')[0] + ')';
  document.getElementById('gear-btn').style.display = sesion.rol==='admin' ? 'inline-block' : 'none';
  switchTab('nueva');
  renderNueva();
  if(sesion.rol==='admin') iniciarChequeoPendientes();
}

let pendientesInterval = null;
async function iniciarChequeoPendientes(){
  await actualizarBadgePendientes(true);
  if(pendientesInterval) clearInterval(pendientesInterval);
  pendientesInterval = setInterval(()=>actualizarBadgePendientes(false), 30000);
}
async function actualizarBadgePendientes(avisarConToast){
  if(!sesion || sesion.rol!=='admin') return;
  const usuarios = await fetchAllUsers();
  const n = usuarios.filter(u=>u.role==='pending').length;
  const badge = document.getElementById('gear-badge');
  if(!badge) return;
  if(n>0){ badge.textContent = n>9?'9+':n; badge.classList.add('show'); }
  else{ badge.classList.remove('show'); }
  if(avisarConToast && n>0){
    toast(n===1 ? 'Tenés 1 solicitud de acceso pendiente' : 'Tenés '+n+' solicitudes de acceso pendientes');
  }
}

/* ============================= GESTIÓN DE USUARIOS (solo admin) ============================= */
async function abrirGestionUsuarios(){
  if(!sesion || sesion.rol!=='admin'){ toast('Solo el administrador principal puede gestionar usuarios'); return; }
  const usuarios = await fetchAllUsers();
  const pendientes = usuarios.filter(u=>u.role==='pending');
  const activos = usuarios.filter(u=>u.role!=='pending');
  const sheet = document.getElementById('modal-sheet');
  sheet.innerHTML = `
    <div class="modal-handle"></div>
    <h2 style="margin:0 0 4px;">Usuarios / técnicos</h2>
    <div class="req-note" style="margin-bottom:10px;">Solo la cuenta administradora (${esc(sesion.email)}) puede aprobar o quitar acceso.</div>
    ${pendientes.length? `
      <div class="divider-label">Pendientes de aprobación</div>
      <div>
        ${pendientes.map(u=>`
          <div class="user-row">
            <div><div class="u-name">${esc(u.nombre||u.email)}</div><div class="u-user">${esc(u.email)}</div></div>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-dark btn-sm" onclick="aprobarUsuario('${u.uid}')">Aprobar</button>
              <button class="btn-danger-ghost btn-sm" onclick="rechazarUsuario('${u.uid}')">Rechazar</button>
            </div>
          </div>
        `).join('')}
      </div>
    ` : ''}
    <div class="divider-label">Usuarios activos</div>
    <div>
      ${activos.map(u=>`
        <div class="user-row">
          <div><div class="u-name">${esc(u.nombre||u.email)} ${u.role==='admin'?'· Admin':''}</div><div class="u-user">${esc(u.email)}</div></div>
          ${u.role!=='admin' ? `<button class="btn-danger-ghost btn-sm" onclick="revocarUsuario('${u.uid}')">Quitar acceso</button>` : ''}
        </div>
      `).join('') || '<div style="color:var(--muted); font-size:13px;">No hay usuarios activos.</div>'}
    </div>
    <div class="req-note" style="margin-top:16px;">Para sumar un técnico, pedile que entre a este mismo enlace y toque "Solicitar acceso" — vos lo aprobás desde acá.</div>
    <button class="btn btn-outline" style="width:100%; margin-top:10px;" onclick="cerrarModal()">Cerrar</button>
  `;
  document.getElementById('modal-overlay').classList.add('show');
}
async function aprobarUsuario(uid){
  if(!sesion || sesion.rol!=='admin') return;
  await setUserRole(uid, 'tecnico');
  toast('Usuario aprobado ✓');
  abrirGestionUsuarios();
  actualizarBadgePendientes(false);
}
async function rechazarUsuario(uid){
  if(!sesion || sesion.rol!=='admin') return;
  if(!confirm('¿Rechazar esta solicitud?')) return;
  await setUserRole(uid, 'rejected');
  toast('Solicitud rechazada');
  abrirGestionUsuarios();
  actualizarBadgePendientes(false);
}
async function revocarUsuario(uid){
  if(!sesion || sesion.rol!=='admin') return;
  if(!confirm('¿Quitarle el acceso a este usuario?')) return;
  await setUserRole(uid, 'rejected');
  toast('Acceso revocado');
  abrirGestionUsuarios();
}


/* ============================= INIT ============================= */
initAuth();
</script>
